server:
  port: ${PORT:8080}

spring:
  application:
    name: secure-file-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:securefiledb}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:fileuser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:filepassword}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET:9a6f8b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a}
  expirationMs: 86400000

app:
  upload:
    dir: ${FILE_UPLOAD_DIR:./uploads}
