version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: secure_file_postgres
    environment:
      POSTGRES_DB: securefiledb
      POSTGRES_USER: fileuser
      POSTGRES_PASSWORD: filepassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileuser -d securefiledb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secure_file_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/securefiledb
      SPRING_DATASOURCE_USERNAME: fileuser
      SPRING_DATASOURCE_PASSWORD: filepassword
      FILE_UPLOAD_DIR: /app/uploads
    volumes:
      - file_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secure_file_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  file_uploads:
